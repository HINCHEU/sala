# Local development: source mounted live, Vite dev server, MinIO and Mailpit.
# Deploys use `docker compose -f compose.yaml ...`, which skips this file.
x-dev: &dev
  volumes:
    - .:/var/www/html
  environment:
    OPCACHE_VALIDATE_TIMESTAMPS: 1

services:
  nginx:
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app:/var/www/html/storage/app:ro

  app:
    <<: *dev

  worker:
    <<: *dev

  mysql:
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"

  vite:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Linux node_modules stay in the container so they never clash with a Windows/macOS host install.
      - /app/node_modules

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MEDIA_KEY}
      MINIO_ROOT_PASSWORD: ${MEDIA_SECRET}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the media buckets, logos bucket readable by anyone.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $${MEDIA_KEY} $${MEDIA_SECRET}; do sleep 1; done
      && mc mb -p local/$${MEDIA_BUCKET} local/$${MEDIA_PUBLIC_BUCKET}
      && mc anonymous set download local/$${MEDIA_PUBLIC_BUCKET}"
    env_file: .env

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  minio-data:
